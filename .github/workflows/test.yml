name: Public causal narrative tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install public dependencies
        run: npm install --no-audit --no-fund
      - name: Run public prototype and core tests
        run: npm test
      - name: Check standalone core
        run: npm run test:core
      - name: Demonstrate standalone core
        run: npm run demo:core
      - name: Run previous offline example
        run: npm run demo
